[versions]
material3 = "1.11.0-alpha07"
navigation3 = "1.1.1"
kodemirror = "0.2.0"

[libraries]
compose.material3.windowsizeclass = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "material3" }

# Core Navigation 3 libraries
androidx.navigation3.ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx.navigation3.runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
# Additional Navigation 3 libraries
androidx.lifecycle.viewmodel.navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version = "2.11.0-beta02" }
androidx.material3.adaptive.navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version = "1.3.0-beta02" }

# Android
androidx.activity.compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx.core.splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }

# Material Kolor
materialkolor = { module = "com.materialkolor:material-kolor", version = "5.0.0-alpha07" }

# KodeMirror
kodemirror.state = { module = "com.monkopedia.kodemirror:state", version.ref = "kodemirror" }
kodemirror.view = { module = "com.monkopedia.kodemirror:view", version.ref = "kodemirror" }
kodemirror.language = { module = "com.monkopedia.kodemirror:language", version.ref = "kodemirror" }
kodemirror.commands = { module = "com.monkopedia.kodemirror:commands", version.ref = "kodemirror" }
kodemirror.autocomplete = { module = "com.monkopedia.kodemirror:autocomplete", version.ref = "kodemirror" }
kodemirror.search = { module = "com.monkopedia.kodemirror:search", version.ref = "kodemirror" }
kodemirror.lint = { module = "com.monkopedia.kodemirror:lint", version.ref = "kodemirror" }
kodemirror.collab = { module = "com.monkopedia.kodemirror:collab", version.ref = "kodemirror" }
kodemirror.theme.material = { module = "com.monkopedia.kodemirror:material-theme", version.ref = "kodemirror" }
kodemirror.lang.markdown = { module = "com.monkopedia.kodemirror:lang-markdown", version.ref = "kodemirror" }
kodemirror.bom = { module = "com.monkopedia.kodemirror:kodemirror-bom", version.ref = "kodemirror" }

# File Storatge
bitgrind.filestorage = { module = "com.bitgrind.kmp:filestorage", version = "0.1.3" }

# Koog
koog.agents = { module = "ai.koog:koog-agents", version = "1.0.0" }
koog.agents.additions = { module = "ai.koog:koog-agents-additions", version = "1.0.0-beta" }
