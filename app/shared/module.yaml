product:
  type: kmp/lib
  #  platforms: [jvm, android, wasmJs, iosSimulatorArm64, iosArm64]
  platforms: [ jvm, android ]

dependencies:
  - $compose.foundation: exported
  - $compose.material3: exported
  - $compose.components.resources: exported

  - $libs.compose.material3.windowsizeclass: exported
  - $libs.androidx.navigation3.ui

  - $libs.materialkolor

  - $libs.kodemirror.state
  - $libs.kodemirror.view
  - $libs.kodemirror.language
  - $libs.kodemirror.commands
  - $libs.kodemirror.autocomplete
  - $libs.kodemirror.search
  - $libs.kodemirror.lint
  - $libs.kodemirror.collab
  - $libs.kodemirror.theme.material
  - $libs.kodemirror.lang.markdown
  - bom: $libs.kodemirror.bom

plugins:
  core: enabled

settings:
  kotlin:
    serialization: json
  compose:
    enabled: true
    version: 1.11.0-beta03
    resources:
      exposedAccessors: true
