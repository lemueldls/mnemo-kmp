tasks:
  generateCoreBindings:
    action: !generateBindings
      projectDir: ${project.rootDir}/core
      generatedCommonSourceDir: ${project.rootDir}/app/shared/src/core
      generatedJvmSourceDir: ${project.rootDir}/app/shared/src@jvm/core
      generatedJvmResourcesDir: ${project.rootDir}/app/shared/resources@jvm
      generatedAndroidSourceDir: ${project.rootDir}/app/shared/src@android/core
      generatedAndroidJniLibsDir: ${project.rootDir}/app/android/jniLibs

commands:
  - generateCoreBindings
